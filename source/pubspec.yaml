name: interval_timer
description: Interval timer workout app.
publish_to: "none"

version: 1.5.1+7

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  wakelock_plus: ^1.2.5
  audioplayers: ^6.0.0
  intl: ^0.20.2
  archive: ^4.3.0
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  # There is no ios/Runner.xcodeproj (see CLAUDE.md), so the iOS pass throws
  # PathNotFoundException -- and the uncaught error kills the process before
  # the Android writes it already queued are flushed, leaving the icons stale
  # and colors.xml empty. Leave this off until iOS is regenerated.
  ios: false
  # Build-time only -- icon/ is not a bundled asset directory.
  image_path: "icon/app_icon_square.jpg"
  # Android 8+ masks the icon to the launcher's shape, and falls back to
  # shrinking the legacy icon onto a white badge when no adaptive icon is
  # declared. The foreground is padded so the stopwatch survives a round mask.
  adaptive_icon_background: "#12101B"
  adaptive_icon_foreground: "icon/app_icon_foreground.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true
  assets:
    - assets/donate/
